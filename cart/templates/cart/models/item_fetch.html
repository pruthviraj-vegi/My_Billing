{% load custom_filters %}
<tr id="cart-item-{{ item.id }}">
    <td class="mobile-hide">
        <span data-copy="{{ item.product_variant.barcode }}">{{ item.product_variant.barcode }}</span>
    </td>
    <td>
        <div>
            <span class="font-weight-bold">{{ item.product_variant.product.brand }}</span>
            <span class="mobile-inline text-muted small"> · {{ item.product_variant.simple_name }}</span>
        </div>
    </td>
    <td class="mobile-hide">{{ item.product_variant.simple_name }}</td>
    <td class="price-toggle-cell"
        data-selling-price="{{ item.product_variant.mrp }}"
        data-purchase-price="{{ item.product_variant.purchase_price }}">
        <span class="price-display">{{ item.product_variant.mrp|currency }}</span>
    </td>
    <td>
        <input type="number"
               class="form-input quantity-input"
               value="{{ item.quantity }}"
               data-item-id="{{ item.id }}"
               min="0.1"
               step="1">
    </td>
    <td>
        <input type="number"
               class="form-input price-input"
               value="{{ item.price }}"
               data-item-id="{{ item.id }}"
               min="0"
               step="1">
    </td>
    <td class="discount-cell mobile-hide">{{ item.discount_percentage|default:"0" }}%</td>
    <td class="amount-cell">{{ item.amount|currency }}</td>
    <td class="text-center">
        <button type="button"
                class="btn btn-primary update-item-btn"
                data-item-id="{{ item.id }}"
                tabindex="-1">
            <i class="fas fa-save"></i>
        </button>
        <button type="button"
                class="btn btn-danger delete-item-btn"
                data-item-id="{{ item.id }}"
                tabindex="-1">
            <i class="fas fa-trash"></i>
        </button>
    </td>
</tr>
